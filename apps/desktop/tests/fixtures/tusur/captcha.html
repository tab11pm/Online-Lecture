<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Проверка — ТУСУР</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  </head>
  <body>
    <main class="login">
      <h1>Подтвердите, что вы не робот</h1>
      <form
        class="login-form"
        action="https://profile.tusur.ru/login"
        method="post"
      >
        <input id="username" name="username" type="hidden" />
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
        />
        <div
          class="g-recaptcha"
          data-sitekey="6Lc-SYNTHETIC-00000000000000000000"
          data-callback="onSubmit"
        ></div>
        <button type="submit">Войти</button>
      </form>
    </main>
  </body>
</html>
