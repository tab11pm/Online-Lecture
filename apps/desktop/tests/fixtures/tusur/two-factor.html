<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Подтверждение входа — ТУСУР</title>
  </head>
  <body>
    <main class="two-factor">
      <h1>Подтверждение входа</h1>
      <p>Введите код подтверждения, отправленный в SMS.</p>
      <form action="https://profile.tusur.ru/two-factor" method="post">
        <label for="code">Код из SMS</label>
        <input
          id="code"
          name="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          required
        />
        <button type="submit">Подтвердить</button>
      </form>
    </main>
  </body>
</html>
