name: Windows preview build

on:
  push:
    branches:
      - build/windows-v0.1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Type-check workspace
        run: npm run build

      - name: Build Windows installer
        run: npm run dist:win -w @online-lecture/desktop

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run packaged Electron E2E
        run: npm test -w @online-lecture/desktop -- tests/e2e --no-file-parallelism
        env:
          CI_ELECTRON_E2E: '1'
          ONLINE_LECTURE_PACKAGED_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/win-unpacked/OnlineLecture.exe

      - name: Upload Windows preview installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview-0.1.0
          path: |
            apps/desktop/dist/OnlineLecture-Setup-0.1.0-x64.exe
            apps/desktop/dist/OnlineLecture-Setup-0.1.0-x64.exe.sha256
          if-no-files-found: error
