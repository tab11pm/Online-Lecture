name: Windows preview build

on:
  push:
    branches:
      - build/windows-v0.1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Type-check workspace
        run: npm run build

      - name: Build Windows installer
        run: npm run dist:win -w @online-lecture/desktop

      - name: Upload Windows preview installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview-0.1.0
          path: |
            apps/desktop/dist/OnlineLecture-Setup-0.1.0-x64.exe
            apps/desktop/dist/OnlineLecture-Setup-0.1.0-x64.exe.sha256
          if-no-files-found: error

      - name: Smoke-check packaged runtime (SQLite, Playwright, MCP)
        timeout-minutes: 3
        run: |
          $runtimeScript = @'
          import { mkdtempSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { dirname, join } from 'node:path';
          import {
            performMcpHandshake,
            runChildProcess,
            smokePackagedRuntime,
          } from './packaged-runtime-smoke.ts';

          async function main() {
            const executablePath = process.env.ONLINE_LECTURE_PACKAGED_EXECUTABLE;
            if (!executablePath) throw new Error('packaged executable is required');
            const cwd = mkdtempSync(join(tmpdir(), 'online-lecture-runtime-'));
            console.log('Starting packaged runtime checks');
            try {
              await smokePackagedRuntime(
                { executablePath, packageDir: dirname(executablePath), cwd },
                {
                  runChild: async (command, args, options) => {
                    const label = args[1] === '--version' ? 'Playwright CLI' : 'SQLite';
                    console.log(`Starting packaged ${label} check`);
                    await runChildProcess(command, args, options);
                    console.log(`Packaged ${label} check passed`);
                  },
                  handshake: async (input) => {
                    console.log('Starting packaged MCP handshake');
                    await performMcpHandshake(input);
                    console.log('Packaged MCP handshake passed');
                  },
                },
              );
              console.log('Packaged runtime checks passed');
            } finally {
              rmSync(cwd, { recursive: true, force: true });
            }
          }

          void main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          '@
          Set-Content -Path apps/desktop/scripts/ci-runtime-smoke.ts -Value $runtimeScript -Encoding utf8NoBOM
          npx tsx apps/desktop/scripts/ci-runtime-smoke.ts
        env:
          ONLINE_LECTURE_PACKAGED_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/win-unpacked/OnlineLecture.exe

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers

      - name: Run packaged Electron E2E
        timeout-minutes: 6
        run: npm test -w @online-lecture/desktop -- tests/e2e --no-file-parallelism --bail=1 --reporter=verbose
        env:
          CI_ELECTRON_E2E: '1'
          DEBUG: pw:browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          ONLINE_LECTURE_PACKAGED_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/win-unpacked/OnlineLecture.exe
